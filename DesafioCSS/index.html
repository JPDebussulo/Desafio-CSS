<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Caderno de Planejamento</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Sessões de anotações">
      <div class="sidebar__header">
        <p class="eyebrow">Organizador pessoal</p>
        <h1>Planeje e acompanhe</h1>
        <p class="muted">Clique em um tópico para escrever ou revisar suas anotações.</p>
      </div>
      <nav class="sidebar__list" id="section-list" role="tablist" aria-orientation="vertical"></nav>
    </aside>

    <main class="editor" role="region" aria-live="polite">
      <div class="editor__header">
        <div>
          <p class="eyebrow">Sessão atual</p>
          <h2 id="section-title">Selecione um tópico</h2>
        </div>
        <p class="muted" id="autosave-hint">Salvamento automático a cada digitação.</p>
      </div>
      <section class="editor__body">
        <label class="field" for="notes-area">
          <span id="field-label">Conteúdos e planos</span>
          <textarea id="notes-area" placeholder="Clique em um tópico e comece a escrever seus planos, metas ou ideias"></textarea>
        </label>
        <div class="status-bar" id="status-bar" aria-live="polite">Nenhuma sessão selecionada.</div>
      </section>
    </main>
  </div>
</body>
</html>
